name: Build Imperial Reader APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/ImperialReader/**"
      - ".github/workflows/build-imperialreader-apk.yml"
  pull_request:
    paths:
      - "android/ImperialReader/**"
      - ".github/workflows/build-imperialreader-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/ImperialReader
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImperialReader-debug-apk
          path: android/ImperialReader/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
